<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Garden For You 🌷</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
    background:#cceeff;
}


/* =========================
   MAIN PAGE
========================= */

.page{
    min-height:100vh;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #91d4f5 0%,
        #bde8fa 30%,
        #dff3d6 55%,
        #82bd72 100%
    );
}


/* =========================
   SUN
========================= */

.sun{
    position:absolute;

    top:35px;
    right:9%;

    width:140px;
    height:140px;

    border-radius:50%;

    background:#fff7bd;

    box-shadow:
    0 0 0 30px rgba(255,248,190,.14),
    0 0 80px 30px rgba(255,246,180,.45);

    z-index:1;
}


/* =========================
   CLOUDS
========================= */

.cloud{
    position:absolute;

    width:180px;
    height:55px;

    background:rgba(255,255,255,.82);

    border-radius:100px;

    z-index:2;

    filter:blur(.2px);
}

.cloud:before,
.cloud:after{
    content:"";

    position:absolute;

    background:inherit;

    border-radius:50%;
}

.cloud:before{
    width:80px;
    height:80px;

    left:28px;
    bottom:15px;
}

.cloud:after{
    width:95px;
    height:95px;

    right:25px;
    bottom:10px;
}

.c1{
    top:115px;
    left:8%;
    transform:scale(.75);
}

.c2{
    top:205px;
    right:14%;
    transform:scale(.55);
}

.c3{
    top:75px;
    left:42%;
    transform:scale(.45);
}


/* =========================
   HEADER
========================= */

.header{
    position:relative;

    z-index:20;

    text-align:center;

    padding:55px 20px 10px;
}

.title{
    font-family:"Playfair Display",serif;

    font-size:clamp(3rem,8vw,6.3rem);

    font-weight:600;

    color:#fffdf5;

    letter-spacing:-2px;

    text-shadow:
    0 4px 18px rgba(70,110,120,.22);
}

.title span{
    color:#ffe6ef;
}

.intro{
    max-width:650px;

    margin:18px auto 0;

    padding:16px 28px;

    border-radius:50px;

    color:#496957;

    font-size:clamp(.95rem,2vw,1.08rem);

    line-height:1.7;

    background:rgba(255,255,255,.48);

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 30px rgba(70,120,100,.1);
}


/* =========================
   GARDEN AREA
========================= */

.garden{
    position:relative;

    min-height:720px;

    margin-top:5px;

    overflow:hidden;
}


/* =========================
   BACK HILLS
========================= */

.hill{
    position:absolute;

    border-radius:50% 50% 0 0;
}

.hill1{
    width:130%;
    height:330px;

    left:-15%;

    bottom:180px;

    background:#a9d889;

    opacity:.8;
}

.hill2{
    width:130%;
    height:350px;

    left:12%;

    bottom:90px;

    background:#72b66a;
}

.hill3{
    width:140%;
    height:330px;

    left:-20%;

    bottom:-70px;

    background:
    linear-gradient(
        to bottom,
        #4f9b5a,
        #286d40
    );
}


/* =========================
   FLOWERING TREES
========================= */

.tree{
    position:absolute;

    z-index:4;

    bottom:185px;

    width:230px;
    height:330px;
}

.tree.left{
    left:-55px;
}

.tree.right{
    right:-55px;
}

.trunk{
    position:absolute;

    bottom:0;

    left:95px;

    width:28px;
    height:210px;

    border-radius:20px;

    background:
    linear-gradient(
        to right,
        #754f39,
        #a77958
    );

    transform:rotate(4deg);
}

.branch{
    position:absolute;

    width:20px;
    height:130px;

    background:#815940;

    border-radius:20px;

    bottom:130px;

    left:70px;

    transform:rotate(-45deg);
}

.branch2{
    position:absolute;

    width:18px;
    height:120px;

    background:#815940;

    border-radius:20px;

    bottom:120px;

    right:70px;

    transform:rotate(48deg);
}

.crown{
    position:absolute;

    width:230px;
    height:180px;

    border-radius:50%;

    top:0;

    background:

    radial-gradient(
        circle at 25% 30%,
        #ffd6e7 0 15%,
        transparent 16%
    ),

    radial-gradient(
        circle at 50% 15%,
        #ffc3da 0 18%,
        transparent 19%
    ),

    radial-gradient(
        circle at 75% 30%,
        #ffd2e4 0 16%,
        transparent 17%
    ),

    radial-gradient(
        circle at 35% 65%,
        #f7a9c8 0 20%,
        transparent 21%
    ),

    radial-gradient(
        circle at 70% 65%,
        #ffc7dc 0 20%,
        transparent 21%
    ),

    #e9a8c4;

    box-shadow:
    0 0 40px rgba(255,180,210,.3);
}


/* =========================
   PATH
========================= */

.path{
    position:absolute;

    z-index:6;

    left:50%;
    bottom:-30px;

    transform:translateX(-50%);

    width:310px;
    height:470px;

    background:
    linear-gradient(
        to bottom,
        rgba(250,245,220,.7),
        rgba(210,190,150,.85)
    );

    clip-path:
    polygon(
        46% 0,
        56% 0,
        67% 25%,
        56% 48%,
        100% 100%,
        0 100%,
        43% 48%,
        32% 25%
    );
}


/* =========================
   STONE DETAILS
========================= */

.stone{
    position:absolute;

    width:35px;
    height:16px;

    border-radius:50%;

    background:rgba(255,255,255,.45);

    z-index:7;
}

.s1{bottom:70px;left:43%;}
.s2{bottom:120px;left:54%;}
.s3{bottom:190px;left:46%;}
.s4{bottom:250px;left:52%;}


/* =========================
   BUTTERFLIES
========================= */

.butterfly{
    position:absolute;

    z-index:15;

    font-size:25px;

    animation:fly 5s ease-in-out infinite;
}

.b1{
    left:17%;
    top:230px;
}

.b2{
    right:17%;
    top:320px;

    animation-delay:-2s;
}

.b3{
    left:61%;
    top:250px;

    animation-delay:-3s;
}

@keyframes fly{

    0%,100%{
        transform:
        translate(0,0)
        rotate(-8deg);
    }

    50%{
        transform:
        translate(35px,-35px)
        rotate(10deg);
    }
}


/* =========================
   PETALS
========================= */

.petal{
    position:absolute;

    width:12px;
    height:8px;

    border-radius:70% 30% 70% 30%;

    background:#ffc4dc;

    opacity:.8;

    z-index:12;

    animation:fall linear infinite;
}

.p1{
    left:10%;
    animation-duration:12s;
}

.p2{
    left:27%;
    animation-duration:16s;
    animation-delay:-4s;
}

.p3{
    left:52%;
    animation-duration:13s;
    animation-delay:-8s;
}

.p4{
    left:76%;
    animation-duration:17s;
    animation-delay:-2s;
}

.p5{
    left:92%;
    animation-duration:11s;
    animation-delay:-6s;
}

@keyframes fall{

    from{
        transform:
        translateY(-100px)
        rotate(0deg);
    }

    to{
        transform:
        translateY(850px)
        translateX(80px)
        rotate(360deg);
    }
}


/* =========================
   FLOWER BUTTON
========================= */

.flower{
    position:absolute;

    z-index:20;

    border:none;

    background:transparent;

    cursor:pointer;

    width:125px;
    height:180px;

    transition:.35s;

    animation:sway 4s ease-in-out infinite;
}

.flower:hover{
    transform:
    scale(1.13)
    translateY(-12px);

    z-index:30;
}

@keyframes sway{

    0%,100%{
        rotate:-2deg;
    }

    50%{
        rotate:2deg;
    }
}


/* =========================
   STEM
========================= */

.stem{
    position:absolute;

    width:9px;

    height:105px;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    border-radius:10px;

    background:
    linear-gradient(
        to right,
        #327642,
        #76b85f
    );
}


/* =========================
   LEAVES
========================= */

.leaf{
    position:absolute;

    width:38px;
    height:20px;

    background:
    linear-gradient(
        135deg,
        #80bd68,
        #2e7845
    );

    border-radius:
    100% 0 100% 0;
}

.leaf1{
    left:20px;
    bottom:40px;

    transform:rotate(-30deg);
}

.leaf2{
    right:20px;
    bottom:65px;

    transform:scaleX(-1)
    rotate(-30deg);
}


/* =========================
   FLOWER HEAD
========================= */

.head{
    position:absolute;

    top:0;

    left:50%;

    transform:translateX(-50%);
}


/* =========================
   ROSE
========================= */

.roseHead{

    width:82px;
    height:82px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        #b91f45 0 10%,
        #d6335e 11% 25%,
        #e9537a 26% 42%,
        #f57b9b 43% 60%,
        #ff9eb8 61% 78%,
        #fbd0db 79%
    );

    box-shadow:
    inset 10px -8px 18px rgba(170,20,60,.22);
}


/* =========================
   SUNFLOWER
========================= */

.sunflowerHead{

    width:105px;
    height:105px;

    border-radius:50%;

    background:

    repeating-conic-gradient(
        #ffd34d 0deg 12deg,
        #f5b920 12deg 20deg
    );

    display:flex;
    justify-content:center;
    align-items:center;
}

.sunflowerHead:after{

    content:"";

    width:48px;
    height:48px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        #57351d,
        #7b4b22 55%,
        #4b2c18
    );

    box-shadow:
    inset 0 0 8px rgba(0,0,0,.4);
}


/* =========================
   TULIP
========================= */

.tulipHead{

    width:72px;
    height:92px;

    border-radius:
    45% 45% 40% 40% /
    70% 70% 30% 30%;

    background:
    linear-gradient(
        135deg,
        #ff8eb3,
        #df2f67
    );

    clip-path:
    polygon(
        0 25%,
        20% 0,
        42% 22%,
        60% 0,
        80% 18%,
        100% 25%,
        85% 100%,
        15% 100%
    );
}


/* =========================
   LAVENDER
========================= */

.lavenderHead{

    width:60px;
    height:110px;

    background:

    radial-gradient(
        ellipse at center,
        #8b63c7 0 18%,
        transparent 20%
    );

}

.lavenderHead:before{

    content:"";

    position:absolute;

    inset:0;

    background:

    radial-gradient(
        circle at 30% 10%,
        #a983df 0 8px,
        transparent 9px
    ),

    radial-gradient(
        circle at 65% 22%,
        #8051bb 0 8px,
        transparent 9px
    ),

    radial-gradient(
        circle at 35% 35%,
        #b18ae4 0 8px,
        transparent 9px
    ),

    radial-gradient(
        circle at 70% 48%,
        #8b5ac4 0 8px,
        transparent 9px
    ),

    radial-gradient(
        circle at 30% 62%,
        #a576d6 0 8px,
        transparent 9px
    ),

    radial-gradient(
        circle at 62% 75%,
        #8152b9 0 8px,
        transparent 9px
    );
}


/* =========================
   LOTUS
========================= */

.lotusHead{

    width:105px;
    height:80px;

    position:relative;
}

.lotusHead:before,
.lotusHead:after{

    content:"";

    position:absolute;

    width:55px;
    height:75px;

    background:
    linear-gradient(
        to top,
        #f59cb8,
        #ffd5e2
    );

    border-radius:
    80% 20% 80% 20%;
}

.lotusHead:before{

    left:15px;

    transform:
    rotate(-30deg);
}

.lotusHead:after{

    right:15px;

    transform:
    scaleX(-1)
    rotate(-30deg);
}

.lotusHead{

    background:

    radial-gradient(
        ellipse at center bottom,
        #ffb5cc 0 30%,
        transparent 31%
    );
}


/* =========================
   CHERRY BLOSSOM
========================= */

.cherryHead{

    width:100px;
    height:100px;

    background:

    radial-gradient(
        circle at 30% 30%,
        #ffd4e5 0 20px,
        transparent 21px
    ),

    radial-gradient(
        circle at 70% 30%,
        #ffbdd7 0 20px,
        transparent 21px
    ),

    radial-gradient(
        circle at 30% 70%,
        #ffc8df 0 20px,
        transparent 21px
    ),

    radial-gradient(
        circle at 70% 70%,
        #ffd5e6 0 20px,
        transparent 21px
    ),

    radial-gradient(
        circle at center,
        #f5a5c4 0 18px,
        transparent 19px
    );
}


/* =========================
   LILY
========================= */

.lilyHead{

    width:105px;
    height:105px;

    background:

    radial-gradient(
        ellipse at center,
        #fff8ef 0 22%,
        transparent 23%
    ),

    conic-gradient(
        from 0deg,
        #fff,
        #ffeef5,
        #fff,
        #fbe7ef,
        #fff
    );

    clip-path:
    polygon(
        50% 0,
        62% 32%,
        100% 20%,
        72% 48%,
        100% 78%,
        62% 67%,
        50% 100%,
        38% 67%,
        0 78%,
        28% 48%,
        0 20%,
        38% 32%
    );

    filter:
    drop-shadow(0 5px 5px rgba(0,0,0,.08));
}


/* =========================
   JASMINE
========================= */

.jasmineHead{

    width:95px;
    height:95px;

    background:

    radial-gradient(
        circle at center,
        #f5c84a 0 12px,
        transparent 13px
    ),

    conic-gradient(
        from 0deg,

        transparent 0deg 10deg,
        white 10deg 55deg,

        transparent 55deg 82deg,
        white 82deg 127deg,

        transparent 127deg 154deg,
        white 154deg 199deg,

        transparent 199deg 226deg,
        white 226deg 271deg,

        transparent 271deg 298deg,
        white 298deg 343deg
    );

    border-radius:50%;

    filter:
    drop-shadow(0 3px 5px rgba(0,0,0,.1));
}


/* =========================
   FLOWER POSITIONS
========================= */

.rose{
    left:5%;
    bottom:70px;
}

.sunflower{
    left:18%;
    bottom:120px;

    width:145px;
    height:205px;
}

.tulip{
    left:38%;
    bottom:55px;
}

.lavender{
    right:32%;
    bottom:115px;
}

.lotus{
    right:5%;
    bottom:80px;

    width:145px;
    height:150px;
}

.cherry{
    left:8%;
    bottom:310px;
}

.lily{
    right:8%;
    bottom:305px;
}

.jasmine{
    left:50%;
    bottom:240px;

    transform:translateX(-50%);
}


/* =========================
   LABEL
========================= */

.flowerName{

    position:absolute;

    left:50%;
    bottom:-22px;

    transform:translateX(-50%);

    color:white;

    font-family:
    "Playfair Display",
    serif;

    font-size:18px;

    text-shadow:
    0 2px 6px rgba(0,0,0,.3);

    opacity:0;

    transition:.3s;

    white-space:nowrap;
}

.flower:hover .flowerName{
    opacity:1;
}


/* =========================
   POPUP
========================= */

.overlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    z-index:100;

    background:
    rgba(50,90,65,.32);

    backdrop-filter:
    blur(12px);
}


.popup{

    position:relative;

    width:min(92%,570px);

    max-height:85vh;

    overflow-y:auto;

    padding:45px 32px 38px;

    border-radius:35px;

    text-align:center;

    background:

    linear-gradient(
        135deg,
        rgba(255,255,255,.94),
        rgba(255,245,249,.9)
    );

    box-shadow:
    0 25px 80px
    rgba(40,70,45,.3);

    animation:popupOpen .4s ease;
}


.popup:before{

    content:"❀  ✿  ❀";

    display:block;

    color:#e899b5;

    font-size:23px;

    margin-bottom:10px;
}


@keyframes popupOpen{

    from{
        opacity:0;

        transform:
        scale(.85)
        translateY(25px);
    }

    to{
        opacity:1;

        transform:
        scale(1)
        translateY(0);
    }
}


.popupFlower{

    font-size:60px;

    margin-bottom:8px;
}


.popup h2{

    font-family:
    "Playfair Display",
    serif;

    font-size:
    clamp(2rem,5vw,2.9rem);

    color:#76516d;

    margin-bottom:18px;
}


.popup p{

    color:#4c6252;

    line-height:1.85;

    font-size:1rem;
}


.close{

    margin-top:28px;

    padding:12px 28px;

    border:none;

    border-radius:30px;

    background:
    linear-gradient(
        135deg,
        #e79ab6,
        #c48ccf
    );

    color:white;

    font-family:"DM Sans",sans-serif;

    cursor:pointer;

    transition:.3s;

    box-shadow:
    0 8px 18px rgba(190,110,150,.25);
}

.close:hover{

    transform:
    translateY(-3px)
    scale(1.04);
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .header{
        padding-top:42px;
    }

    .intro{
        margin:15px 12px;
        padding:14px 18px;
    }

    .garden{
        min-height:680px;
    }

    .flower{
        transform:scale(.72);
    }

    .flower:hover{
        transform:
        scale(.8)
        translateY(-8px);
    }

    .rose{
        left:-3%;
    }

    .sunflower{
        left:11%;
    }

    .tulip{
        left:31%;
    }

    .lavender{
        right:25%;
    }

    .lotus{
        right:-2%;
    }

    .cherry{
        left:3%;
        bottom:325px;
    }

    .lily{
        right:2%;
        bottom:320px;
    }

    .jasmine{
        bottom:255px;
    }

    .tree{
        transform:scale(.68);
    }

    .tree.left{
        left:-85px;
    }

    .tree.right{
        right:-85px;
    }

    .path{
        width:230px;
    }

    .popup{
        padding:35px 22px;
    }

    .popup p{
        font-size:.94rem;
        line-height:1.75;
    }

    .flowerName{
        display:none;
    }

}

</style>
</head>

<body>

<div class="page">


<div class="sun"></div>


<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>


<!-- FALLING PETALS -->

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="petal p5"></div>


<!-- HEADER -->

<div class="header">

<h1 class="title">
A Little <span>Garden</span> For You
</h1>

<p class="intro">

Tujhe ek phool se compare karna kabhi enough nahi laga…
isliye socha, kyun na tere liye ek poora garden hi bana doon, baby. 🌷💋

</p>

</div>


<!-- GARDEN -->

<div class="garden">

<div class="hill hill2"></div>
<div class="hill hill3"></div>


<!-- TREES -->

<div class="tree left">

<div class="crown"></div>

<div class="trunk"></div>

<div class="branch"></div>

<div class="branch2"></div>

</div>


<div class="tree right">

<div class="crown"></div>

<div class="trunk"></div>

<div class="branch"></div>

<div class="branch2"></div>

</div>


<!-- PATH -->

<div class="path"></div>

<div class="stone s1"></div>
<div class="stone s2"></div>
<div class="stone s3"></div>
<div class="stone s4"></div>


<!-- BUTTERFLIES -->

<div class="butterfly b1">🦋</div>

<div class="butterfly b3">🦋</div>



<!-- 🌹 ROSE -->

<button class="flower rose"

<div class="stem"></div>

<span class="flowerName">
Rose
</span>

</button>



<!-- 🌻 SUNFLOWER -->

<button class="flower sunflower"

<div class="head sunflowerHead"></div>

<div class="stem"></div>

<div class="leaf leaf1"></div>
<div class="leaf leaf2"></div>

<span class="flowerName">
Sunflower
</span>

</button>



<!-- 🌷 TULIP -->

<button class="flower tulip"
onclick="openFlower(2)">

<div class="head tulipHead"></div>

<div class="stem"></div>

<div class="leaf leaf1"></div>
<div class="leaf leaf2"></div>

<span class="flowerName">
Tulip
</span>

</button>



<!-- 🪻 LAVENDER -->

<button class="flower lavender"
onclick="openFlower(3)">

<div class="head lavenderHead"></div>

<div class="stem"></div>

<div class="leaf leaf1"></div>
<div class="leaf leaf2"></div>

<span class="flowerName">
Lavender
</span>

</button>



<!-- 🪷 LOTUS -->

<button class="flower lotus"
onclick="openFlower(4)">

<div class="head lotusHead"></div>

<div class="stem"></div>

<div class="leaf leaf1"></div>
<div class="
